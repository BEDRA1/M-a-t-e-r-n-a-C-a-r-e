services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-materna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-materna_secret}
      POSTGRES_DB: ${POSTGRES_DB:-materna_care}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - materna_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-materna}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-materna}:${POSTGRES_PASSWORD:-materna_secret}@postgres:5432/${POSTGRES_DB:-materna_care}?schema=public
      PORT: ${PORT:-3000}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_this_access_secret_in_production}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_this_refresh_secret_in_production}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
    ports:
      - '${PORT:-3000}:3000'

volumes:
  materna_postgres_data:
